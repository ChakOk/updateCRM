<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Уровни</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1c2030;--c:#262c42;--tx:#e9ecf6;--m:#8d95b3;--a:#7c9cff;--g:#8fe0bd;--y:#ffd27a}
@media(prefers-color-scheme:light){:root{--bg:#f2f4fa;--c:#fff;--tx:#232842;--m:#6d7594}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:14px 14px 50px}
.c{background:var(--c);border-radius:16px;padding:14px;margin-bottom:12px}
h3{margin:0 0 6px;font-size:12px;color:var(--m);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.top{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.m{color:var(--m);font-size:13px}
.bar{position:relative;height:14px;border-radius:9px;background:var(--bg);margin:18px 16px 34px}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--g));transition:width .6s}
.bar b{position:absolute;top:20px;transform:translateX(-50%);font-size:15px;font-weight:400}
.bar .av{position:absolute;top:-8px;width:30px;height:30px;font-size:17px;transform:translateX(-50%);border:2px solid var(--c);transition:left .6s}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bg)}
.row:first-of-type{border-top:0}
.row span{flex:1}
.ck{width:26px;height:26px;border-radius:8px;border:2px solid var(--m);background:none;color:#fff;font-size:15px;flex:none;padding:0}
.ck.on{background:var(--g);border-color:var(--g);color:#1c2030}
.done{opacity:.55;text-decoration:line-through}
button.b{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid transparent;border-radius:10px;padding:9px;font:inherit}
input.n{width:90px;text-align:right}
.mini{display:flex;gap:8px;margin-top:8px}
.xp{color:var(--y);font-size:12px;white-space:nowrap}
.pill{display:inline-block;background:var(--bg);border-radius:20px;padding:3px 10px;font-size:12px;color:var(--m);margin-right:6px}
.gift{background:var(--y);color:#3a2d00}
details summary{color:var(--m);font-size:13px;cursor:pointer}
textarea{height:140px;font:12px monospace;margin:8px 0}
</style></head><body>
<div id="app"></div>
<script>
const tg=window.Telegram&&Telegram.WebApp;tg&&(tg.ready(),tg.expand());
const API=''; // сюда вставь URL веб-приложения Apps Script (не секрет)
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=iso(new Date()),dd=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const empty=()=>({profile:{name:'',avatar:'🙂'},dream:'',level_now:1,levels:[],bonus:[],st:{log:{},claimed:[],done:[]}});
let D=null,tm;
async function api(a,data){if(!API)return null;const r=await fetch(API,{method:'POST',body:JSON.stringify({action:a,initData:tg?tg.initData:'',data})});return r.json()}
async function load(){
  try{const l=localStorage.getItem('d');if(l)D=JSON.parse(l)}catch(e){}
  try{const r=await api('get');if(r&&r.data)D=r.data}catch(e){}
  D=D||empty();render();
}
function save(){
  try{localStorage.setItem('d',JSON.stringify(D))}catch(e){}
  clearTimeout(tm);tm=setTimeout(()=>api('set',D).catch(()=>{}),800);render();
}
const last=id=>{const a=D.st.log[id]||[];return a.length?a.reduce((x,y)=>x>y?x:y):null};
function calc(){
  const L=D.levels.find(l=>l.n==D.level_now+1);if(!L)return null;
  const H=L.habits||[],M=L.metrics||[];let exp=0,got=0;
  H.forEach(h=>{const e=14/(h.every_days||1);const c=(D.st.log[h.id]||[]).filter(x=>dd(x,T)>=0&&dd(x,T)<14).length;exp+=e;got+=Math.min(c,e)});
  const ef=exp?got/exp:0;let tw=0,s=0;
  M.forEach(m=>{const w=m.w||1;tw+=w;s+=w*Math.max(0,Math.min(1,(m.current-m.start)/((m.target-m.start)||1)))});
  const rs=tw?s/tw:ef,we=(L.weights&&L.weights.effort)??.4,wr=M.length?((L.weights&&L.weights.result)??.6):0;
  let p=(we*ef+wr*rs)/(we+wr);if(M.length&&rs<1)p=Math.min(p,.99);
  return{L,H,M,ef,rs,p};
}
function render(){
  const c=calc(),u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,P=D.profile;
  const av=u&&u.photo_url?`<img src="${esc(u.photo_url)}">`:esc(P.avatar||'🙂');
  const hab=D.levels.flatMap(l=>l.habits||[]);let xp=0;
  hab.forEach(h=>xp+=(D.st.log[h.id]||[]).length*(h.xp||0));
  (D.bonus||[]).forEach(b=>{if(D.st.done.includes(b.id))xp+=b.xp||0});
  let h=`<div class="c top"><div class="av">${av}</div><div style="flex:1"><b>${esc(P.name||(u&&u.first_name)||'Игрок')}</b><div class="m">Уровень ${D.level_now} · <span class="xp">${xp} XP</span></div></div></div>`;
  if(!c){h+=`<div class="c">Пока нет плана. Открой «Настройки» ниже и вставь JSON.</div>`}
  else{
    const{L,H,M,ef,rs,p}=c,pc=Math.round(p*100),R=(L.rewards||[]).slice().sort((a,b)=>a.at-b.at);
    const key=r=>L.n+':'+r.at+':'+r.text,avail=R.filter(r=>pc>=r.at&&!D.st.claimed.includes(key(r))),nxt=R.find(r=>pc<r.at);
    h+=`<div class="c"><h3>Уровень ${D.level_now} → ${L.n}</h3><b>${esc(L.title||'')}</b><div class="bar"><i style="width:${pc}%"></i>${R.map(r=>`<b style="left:${r.at}%">${D.st.claimed.includes(key(r))?'✅':'🎁'}</b>`).join('')}<div class="av" style="left:${pc}%">${av}</div></div>
    <div class="m">Всего <b style="color:var(--tx)">${pc}%</b>${nxt?` · ближайшая награда на ${nxt.at}%: ${esc(nxt.text)}`:''}</div>
    <div style="margin-top:8px"><span class="pill">Усилия ${Math.round(ef*100)}%</span>${M.length?`<span class="pill">Результат ${Math.round(rs*100)}%</span>`:''}</div>
    <div class="m" style="margin-top:6px">${M.length&&ef>=.7&&rs<ef-.25?'Свою часть ты делаешь — метрика не зависит от тебя напрямую и догонит.':ef<.5?'Усилия просели — выполни пару задач, и шкала сдвинется.':'Идёшь в хорошем темпе.'}</div>
    ${p>=1?`<div class="mini"><button class="b" data-a="up">Перейти на уровень ${L.n} 🚀</button></div>`:''}</div>`;
    avail.forEach(r=>h+=`<div class="c"><b>🎁 Награда доступна: ${esc(r.text)}</b><div class="mini"><button class="b gift" data-a="claim" data-id="${esc(key(r))}">Забрать</button></div></div>`);
    if(M.length)h+=`<div class="c"><h3>Метрики (не от тебя зависят)</h3>${M.map(m=>`<div class="row"><span>${esc(m.name)}<div class="m">цель ${m.target}</div></span><input class="n" type="number" inputmode="decimal" value="${m.current}" data-m="${esc(m.id)}"></div>`).join('')}</div>`;
    const due=[],soon=[];
    H.forEach(x=>{const l=last(x.id),dn=l===T,gap=l?dd(l,T):99,e=x.every_days||1;(dn||gap>=e?due:soon).push({x,dn,w:e-gap})});
    h+=`<div class="c"><h3>Сегодня</h3>${due.length?due.map(({x,dn})=>`<div class="row"><button class="ck ${dn?'on':''}" data-a="tick" data-id="${esc(x.id)}">${dn?'✓':''}</button><span class="${dn?'done':''}">${esc(x.name)}</span><i class="xp">+${x.xp||0}</i></div>`).join(''):'<div class="m">На сегодня всё 🎉</div>'}
    ${soon.length?`<div class="m" style="margin-top:8px">Скоро: ${soon.sort((a,b)=>a.w-b.w).slice(0,3).map(s=>esc(s.x.name)+' (через '+s.w+' дн.)').join(', ')}</div>`:''}</div>`;
  }
  h+=`<div class="c"><h3>Побочные квесты</h3>${(D.bonus||[]).map(b=>{const d=D.st.done.includes(b.id);return`<div class="row"><button class="ck ${d?'on':''}" data-a="bonus" data-id="${esc(b.id)}">${d?'✓':''}</button><span class="${d?'done':''}">${esc(b.name)}</span><i class="xp">+${b.xp||0}</i></div>`}).join('')}
  <div class="mini"><input id="bn" placeholder="Новая цель (например: права)"><button class="b" data-a="addB">+</button></div></div>`;
  h+=`<div class="c"><details><summary>Настройки и импорт</summary>
  <div class="mini"><input id="rt" placeholder="Своя награда"><input id="ra" class="n" type="number" placeholder="%" style="width:70px"><button class="b" data-a="addR">+</button></div>
  <textarea id="js" placeholder="Вставь сюда JSON от нейросети"></textarea>
  <div class="mini"><button class="b" data-a="imp">Загрузить</button><button class="b" data-a="exp">Экспорт</button><input type="file" id="fl" accept=".json,.txt" style="flex:1"></div></details></div>`;
  const open=document.querySelector('details')&&document.querySelector('details').open;
  document.getElementById('app').innerHTML=h;if(open)document.querySelector('details').open=true;
}
const A={
  tick(id){const a=D.st.log[id]||[],i=a.indexOf(T);i<0?a.push(T):a.splice(i,1);D.st.log[id]=a;tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('light');save()},
  claim(k){D.st.claimed.push(k);tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success');save()},
  bonus(id){const a=D.st.done,i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);save()},
  up(){D.level_now++;save()},
  addB(){const v=document.getElementById('bn').value.trim();if(!v)return;(D.bonus=D.bonus||[]).push({id:'b'+Date.now(),name:v,xp:20});save()},
  addR(){const t=document.getElementById('rt').value.trim(),a=+document.getElementById('ra').value,c=calc();if(!t||!c||!(a>=0))return;(c.L.rewards=c.L.rewards||[]).push({at:Math.min(100,a),text:t});save()},
  imp(){try{const j=JSON.parse(document.getElementById('js').value.replace(/^```json|```$/g,'').trim());if(!Array.isArray(j.levels))throw 0;D=Object.assign(empty(),j,{st:D.st});save()}catch(e){alert('Не удалось прочитать JSON')}},
  exp(){document.getElementById('js').value=JSON.stringify(D,null,1)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.m){const c=calc(),m=c&&c.M.find(x=>x.id==t.dataset.m);if(m){m.current=+t.value;save()}}
  if(t.id=='fl'&&t.files[0]){const r=new FileReader();r.onload=()=>{document.getElementById('js').value=r.result};r.readAsText(t.files[0])}
});
load();
</script></body></html>
